[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
api_base_url = "https://aisandbox-pa.googleapis.com/v1"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0
max_poll_attempts = 200

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500
remove_watermark = true  # Remove the visible Gemini watermark from Free/Pro account images (applied on first start; change it in the admin panel afterwards)

[call_logic]
call_mode = "default"  # default=random rotation, polling=sequential rotation
tier_order = "save_ultra"  # save_ultra=images Pro→Free→Ultra, videos Ultra→Pro→Free; balanced=ignore account tier (applied on first start; change it in the admin panel afterwards)

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # Cache timeout (seconds), default 2 hours; 0 means never auto-delete the cache
base_url = ""   # Base URL for serving cached files; leave empty to use the server address

[log_cleanup]
# Scheduled retention for the request_logs table. Defaults purge anything
# older than 24 hours every 60 minutes — values used only on first startup;
# afterwards they live in log_cleanup_config and are edited via DB/admin.
enabled = true
retention_hours = 24
interval_minutes = 60
vacuum_after_cleanup = false  # VACUUM needs ~1x DB size in free disk; opt-in only

[captcha]
captcha_method = "extension"  # The only captcha method since 2026-11-04 (worker extension + server fallback)
browser_captcha_generation_retries = 2  # Total retries when the generate endpoint hits reCAPTCHA evaluation failed
personal_project_pool_size = 4  # Default project pool size per token (only affects project rotation)

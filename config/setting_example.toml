[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
labs_base_url = "https://labs.google/fx/api"
api_base_url = "https://aisandbox-pa.googleapis.com/v1"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0
max_poll_attempts = 200

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500
remove_watermark = true  # Remove the visible Gemini watermark from Free/Pro account images (applied on first start; change it in the admin panel afterwards)

[call_logic]
call_mode = "default"  # default=random rotation, polling=sequential rotation
tier_order = "save_ultra"  # save_ultra=images Pro→Free→Ultra, videos Ultra→Pro→Free; balanced=ignore account tier (applied on first start; change it in the admin panel afterwards)

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # Cache timeout (seconds), default 2 hours; 0 means never auto-delete the cache
base_url = ""   # Base URL for serving cached files; leave empty to use the server address

[log_cleanup]
# Scheduled retention for the request_logs table. Defaults purge anything
# older than 24 hours every 60 minutes — values used only on first startup;
# afterwards they live in log_cleanup_config and are edited via DB/admin.
enabled = true
retention_hours = 24
interval_minutes = 60
vacuum_after_cleanup = false  # VACUUM needs ~1x DB size in free disk; opt-in only

[captcha]
captcha_method = "extension"  # Captcha method: extension/yescaptcha/browser/personal/remote_browser
browser_recaptcha_settle_seconds = 3.0  # Extra settle wait after reload/clr is ready
browser_count = 1  # Number of headed browser instances in browser mode
browser_captcha_max_retries = 5  # Max retries per captcha fetch in browser mode
browser_captcha_generation_retries = 2  # Total retries when the generate endpoint hits reCAPTCHA evaluation failed
personal_project_pool_size = 4  # Default project pool size per token in personal mode (only affects project rotation, not the number of captcha tabs)
personal_max_resident_tabs = 5  # Max shared captcha tabs in personal mode; all tokens/projects share these tabs
browser_personal_fresh_restart_every_n_solves = 10  # In personal mode, clean up and restart the browser after this many successful solves; 0 disables
personal_idle_tab_ttl_seconds = 600  # Idle tab reclaim time in personal mode (seconds)
yescaptcha_api_key = ""  # YesCaptcha API key
yescaptcha_base_url = "https://api.yescaptcha.com"
yescaptcha_task_type = "RecaptchaV3TaskProxylessM1S9"  # Options: RecaptchaV3TaskProxyless/RecaptchaV3TaskProxylessM1/RecaptchaV3TaskProxylessM1S7/RecaptchaV3TaskProxylessM1S9
remote_browser_base_url = ""  # Remote headed captcha service URL
remote_browser_api_key = ""   # Remote headed captcha service API key
remote_browser_timeout = 60   # Remote headed captcha request timeout (seconds)
capsolver_api_key = ""
capsolver_base_url = "https://api.capsolver.com"
